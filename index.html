<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/an mail sender.gif" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Huntshot</title>
    <script src="//cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
    <script>
      // This script runs immediately before any React code
      (function() {
        const storedTheme = localStorage.getItem('theme');
        
        if (storedTheme === 'dark' || 
            (storedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) ||
            (!storedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
